name: 🐛 Bug Report
description: Create a report to help us fix a bug in RainRadar Pro
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with RainRadar Pro!
  - type: input
    id: environment
    attributes:
      label: Environment
      description: What browser and OS are you using?
      placeholder: "e.g., Chrome 129 on Windows 11 / iOS Safari 18"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open 'Split Screen' view
        2. Drag time scrubber to 45 min
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
